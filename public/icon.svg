<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0a38" />
      <stop offset="100%" stop-color="#06020c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Academic Cap Top Diamond -->
  <path d="M 32 14 L 54 25 L 32 36 L 10 25 Z" fill="url(#accentGrad)" stroke="#e9d5ff" stroke-width="1.5" />

  <!-- Cap Lower Skullcap -->
  <path d="M 20 30.5 L 20 40 C 20 45, 44 45, 44 40 L 44 30.5" fill="none" stroke="#e9d5ff" stroke-width="2" stroke-linecap="round"/>

  <!-- Golden Tassel -->
  <path d="M 44 26 L 49 32 L 49 42" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="49" cy="44" r="2.5" fill="url(#goldGrad)" />

  <!-- AI Pulse Star / Crest Node at Center -->
  <circle cx="32" cy="25" r="2.5" fill="#ffffff" />
  <circle cx="32" cy="25" r="5" fill="none" stroke="#fbbf24" stroke-width="0.8" stroke-dasharray="2 1"/>
</svg>
