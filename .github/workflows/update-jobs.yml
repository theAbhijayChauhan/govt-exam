name: Daily Government Recruitment Sync & Verification

on:
  schedule:
    # Runs daily at 00:30 UTC (which is 6:00 AM Indian Standard Time)
    - cron: '30 0 * * *'
  # Allows you to trigger the update manually anytime from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚡ Run Daily Job Updater & Verification
        run: node scripts/update-jobs.mjs

      - name: 🚀 Commit and Push if Updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes in src/data/jobs.ts
          if git diff --quiet src/data/jobs.ts; then
            echo "✅ No job updates or date expirations today. Repository is clean."
          else
            echo "📝 Changes detected in jobs database! Committing and pushing..."
            git add src/data/jobs.ts
            git commit -m "chore(jobs): automated daily recruitment sync [skip ci]"
            git push
            echo "🎉 Pushed to GitHub. Cloudflare Pages will auto-rebuild now!"
          fi
